<!doctype html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Content-Security-Policy: scripts only from this site and the Firebase CDN, styles and fonts
     only from this site and Google Fonts. connect-src: 'self' (the two shot sounds the game
     fetches from its own src/ui/audio/, sounds.js, decision Q78); then, by target
     (src/ui/firebase.js):
     - localhost (emulators): http://127.0.0.1:9099 (auth emulator), http://127.0.0.1:9000 and
       ws://127.0.0.1:9000 (database emulator);
     - production (project son-cay), anonymous sign-in of the Firebase JS SDK 13.4.0:
       https://identitytoolkit.googleapis.com (accounts:signUp creates the anonymous user,
       accounts:lookup reads it back), https://securetoken.googleapis.com (refreshes the ID token);
     - production Realtime Database (europe-west1), WebSocket only (forceWebSockets):
       wss://son-cay-default-rtdb.europe-west1.firebasedatabase.app (the database's WebSocket),
       wss://*.europe-west1.firebasedatabase.app (the server named in the connection handshake,
       which the SDK then connects to, e.g. s-....europe-west1.firebasedatabase.app),
       https://son-cay-default-rtdb.europe-west1.firebasedatabase.app (the database over HTTPS:
       the SDK's REST client; not used while WebSockets work, listed so it is never blocked).
     Long polling is never used (it would need script-src for the database host). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' http://127.0.0.1:9099 http://127.0.0.1:9000 ws://127.0.0.1:9000 https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://son-cay-default-rtdb.europe-west1.firebasedatabase.app wss://son-cay-default-rtdb.europe-west1.firebasedatabase.app wss://*.europe-west1.firebasedatabase.app; base-uri 'none'; form-action 'none'">
<!-- Referrer: "strict-origin" sends only the origin (https://malikfikret.github.io), never the
     path or the #/masa/CODE hash, and nothing over plain HTTP. The real API key is restricted to
     this website in Google Cloud, so anonymous sign-in (identitytoolkit / securetoken) is refused
     without it: "no-referrer" would block the game. -->
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="#15100C">
<meta name="description" content="Son Çay: arkadaşlarınla çevrimiçi oynanan bir taktik ve biraz da şans oyunu.">
<title>Son Çay</title>
<link rel="icon" href="src/ui/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="src/ui/style.css">
<script type="module" src="src/ui/app.js"></script>
</head>
<body>
<main id="app">
  <noscript><p class="loading">Son Çay'ı oynamak için tarayıcında JavaScript'i aç.</p></noscript>
</main>
</body>
</html>
